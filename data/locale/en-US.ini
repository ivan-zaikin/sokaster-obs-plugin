Plugin.Name="sokaster"
Plugin.Description="AI co-host inside OBS: watches a source, listens to selected audio sources, and speaks through a browser overlay."
Dock.Title="sokaster"

# Readiness headline: one line at the top of the dock.
# Ready.Setup takes the number of rows that still need fixing.
Dock.Ready.Setup="Steps left before launch: %1"
Dock.Ready.Idle="Ready. Silent until the first order."
Dock.Ready.OnAir="On air"
Dock.Ready.Offline="No connection to the sokaster server. Retrying in %1 s."
Dock.Ready.Stopped="Stopped: the beta budget is used up"
Dock.Cabinet="Dashboard"
Dock.Cabinet.Hint="Orders, volume, on-screen text, lore, and history live in the browser."

# Account row.
Dock.Account="Account"
Dock.Account.SignIn="Sign in with Twitch"
Dock.Account.SignIn.Hint="Sign in with Twitch to connect OBS to your sokaster account. There is nothing to copy."
Dock.Account.Waiting="The browser is open. Sign in with Twitch, then come back to OBS."
Dock.Account.Code="Sign-in code: %1"
Dock.Account.Cancel="Cancel"
Dock.Account.Failed="Sign-in didn't finish. Please try again."
Dock.Account.Expired="Your session has expired. Please sign in again."
Dock.Account.NoApplication="The co-host is in closed beta. Apply in the dashboard; once you're approved, everything starts on its own."
Dock.Account.Pending="Your application from %1 is waiting for approval. Once it's approved, everything starts on its own."
Dock.Account.Rejected="Your beta application was declined. Details are in the dashboard."
Dock.Account.Ok="Signed in as %1"
Dock.Account.SignOut="Sign out"

# Overlay row: the browser source the co-host speaks through.
Dock.Overlay="Overlay"
Dock.Overlay.Missing="There's no overlay in any scene, so the co-host has nowhere to speak."
Dock.Overlay.Add="Add to current scene"
Dock.Overlay.OtherScene="The overlay is only in other scenes. Viewers won't see it in this one."
Dock.Overlay.Stale="The overlay points to an old address. The co-host won't appear in it."
Dock.Overlay.Update="Update address"
Dock.Overlay.Disconnected="The overlay isn't connected to the server. The co-host is silent until it reconnects."
Dock.Overlay.Shutdown="“Shutdown source when not visible” is on for the overlay, so switching scenes cuts the co-host off. Turn it off in the overlay's properties."
Dock.Overlay.Duplicate="The overlay is open in %1 places, so viewers will hear the co-host more than once."
Dock.Overlay.Ok="Connected"
Dock.Overlay.SourceName="sokaster overlay"
Dock.Overlay.Failed="Didn't work. Details are in the OBS log."

# Eyes row: the capture source frames are taken from.
Dock.Eyes="Watches"
Dock.Eyes.Hint="The co-host sees only this source, never the whole program output, so it won't read its own lines back."
Dock.Eyes.None="There's no game, window, or display capture in this scene. The co-host has nothing to look at."
Dock.Eyes.Gone="Source “%1” is gone. Pick another one."
Dock.Eyes.Empty="“%1” is empty right now. Is the game minimized or the window closed?"
Dock.Eyes.Retry="Frames aren't reaching the server. Retrying in %1 s."
Dock.Eyes.Slow="The server asked for fewer frames. Pausing for %1 s."
Dock.Eyes.NotArriving="The server hasn't received a frame in a while. Check the network; the co-host is silent until frames arrive."

# Ears row: audio sources mixed onto the co-host's track.
Dock.Hears="Hears"
Dock.Hears.Hint="Tick the sources the co-host may listen to. Anything unticked is never transcribed."
Dock.Hears.Track="Mixed onto OBS track %1."
Dock.Hears.NoTrack="Streaming and recording use all six OBS tracks, so there is none left to listen on. Untick one in Settings -> Output."
Dock.Hears.Nothing="Nothing is ticked, so the co-host hears neither the game nor you. It will still watch and talk."
Dock.Hears.Disabled="Speech is turned off for your account, so the co-host only watches. You can turn it on in the dashboard."
Dock.Hears.VadFailed="The speech detector didn't load, so the co-host can't hear. Details are in the OBS log (Help -> Log Files)."
Dock.Hears.Retry="Speech isn't reaching the server. Retrying in %1 s."

# Air row: why the co-host is or isn't talking once setup is done.
Dock.Air="On air"
Dock.Air.Pending="Viewer orders waiting for your decision: %1. Open the dashboard to review them."
Dock.Air.NoOrder="Silent until a viewer orders a character. That's by design: the co-host only talks inside an order."
Dock.Air.NoCredit="Paid airtime has run out. The co-host is silent until the next order."
Dock.Air.Budget="The beta budget is used up: $%1 of $%2. The co-host stays silent until it's topped up."
Dock.Air.Reconnecting="The server doesn't see a running session. Reconnecting..."
Dock.Air.Talking="The co-host is on air."
Dock.Air.NotStreaming="OBS isn't streaming. The co-host starts with the stream; orders wait in the queue until then."
